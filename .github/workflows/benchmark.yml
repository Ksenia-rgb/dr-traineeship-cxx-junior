name: ARM64 Cachegrind

on: pull_request

env:
  FILES_ALL: src/main.cpp src/trim-scalar.cpp src/trim-stdsimd.cpp
  FILES_SSE2: src/trim-sse2.cpp
  FILES_AVX2: src/trim-avx2.cpp
  FILES_NEON: src/trim-neon.cpp
  VLG_OPTIONS: --tool=cachegrind --cache-sim=yes
  CG_OPTIONS: --show=Dr --auto=no

jobs:
  cachegrind-sse2:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Build for x86 SSE2
        run: |
          g++ -O3 -msse2 $FILES_ALL $FILES_SSE2 -o trim_sse2_o3
          g++ -O0 -msse2 $FILES_ALL $FILES_SSE2 -o trim_sse2_o0

      - name: Run Cachegrind
        run: |
          python3 .github/workflows/generator.py
          valgrind $VLG_OPTIONS --cachegrind-out-file=cachegrind-sse2-o3.out ./trim_sse2_o3 long.txt
          valgrind $VLG_OPTIONS --cachegrind-out-file=cachegrind-sse2-o0.out ./trim_sse2_o0 long.txt

      - name: Upload Cachegrind Results
        uses: actions/upload-artifact@v4
        with:
          name: cachegrind-sse2
          path: cachegrind-sse2-*.out

  cachegrind-avx2:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Build for x86 AVX2
        run: |
          g++ -O3 -mavx2 $FILES_ALL $FILES_AVX2 -o trim_avx2_o3
          g++ -O0 -mavx2 $FILES_ALL $FILES_AVX2 -o trim_avx2_o0

      - name: Run Cachegrind
        run: |
          python3 .github/workflows/generator.py
          valgrind $VLG_OPTIONS --cachegrind-out-file=cachegrind-avx2-o3.out ./trim_avx2_o3 long.txt
          valgrind $VLG_OPTIONS --cachegrind-out-file=cachegrind-avx2-o0.out ./trim_avx2_o0 long.txt

      - name: Upload Cachegrind Results
        uses: actions/upload-artifact@v4
        with:
          name: cachegrind-avx2
          path: cachegrind-avx2-*.out

  cachegrind-neon:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Build for ARM64 NEON
        run: |
          g++ -O3 -march=armv8-a+simd $FILES_ALL $FILES_NEON -o trim_neon_o3
          g++ -O0 -march=armv8-a+simd $FILES_ALL $FILES_NEON -o trim_neon_o0

      - name: Run Cachegrind
        run: |
          python3 .github/workflows/generator.py
          valgrind $VLG_OPTIONS --cachegrind-out-file=cachegrind-neon-o3.out ./trim_neon_o3 long.txt
          valgrind $VLG_OPTIONS --cachegrind-out-file=cachegrind-neon-o0.out ./trim_neon_o0 long.txt

      - name: Upload Cachegrind Results
        uses: actions/upload-artifact@v4
        with:
          name: cachegrind-neon
          path: cachegrind-neon-*.out
  result:
    needs: [cachegrind-sse2, cachegrind-avx2, cachegrind-neon]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind

      - name: Download all cachegrind results
        uses: actions/download-artifact@v4
        with:
          path: res/

      - name: Output Results SSE2
        run: |
          cg_annotate $CG_OPTIONS res/cachegrind-sse2/cachegrind-sse2-o3.out | sed -n '/-- Function:file/,$p'
          cg_annotate $CG_OPTIONS res/cachegrind-sse2/cachegrind-sse2-o0.out | sed -n '/-- Function:file/,$p'
      - name: Output Results AVX2
        run: |
          cg_annotate $CG_OPTIONS res/cachegrind-avx2/cachegrind-avx2-o3.out | sed -n '/-- Function:file/,$p'
          cg_annotate $CG_OPTIONS res/cachegrind-avx2/cachegrind-avx2-o0.out | sed -n '/-- Function:file/,$p'
      - name: Output Results NEON
        run: |
          cg_annotate $CG_OPTIONS res/cachegrind-neon/cachegrind-neon-o3.out | sed -n '/-- Function:file/,$p'
          cg_annotate $CG_OPTIONS res/cachegrind-neon/cachegrind-neon-o0.out | sed -n '/-- Function:file/,$p'
